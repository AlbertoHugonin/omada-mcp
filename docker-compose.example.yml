# Example: pairing the Omada controller with omada-mcp on the same host.
#
# omada-mcp now supports authenticated MCP Streamable HTTP. Copy .env.example
# to .env, configure Omada Open API credentials, and set a long random
# MCP_HTTP_API_KEY before starting this stack.
services:
  omada-controller:
    image: mbentley/omada-controller:latest
    container_name: omada-controller
    restart: unless-stopped
    # mbentley's image expects host networking for SDN discovery to work
    # correctly. If you run on a remote host, switch to `network_mode: bridge`
    # with the controller's documented port set explicitly mapped.
    network_mode: host
    environment:
      TZ: Europe/Rome
      PUID: "1000"
      PGID: "1000"
      MANAGE_HTTP_PORT: "8088"
      MANAGE_HTTPS_PORT: "8043"
      PORTAL_HTTP_PORT: "8088"
      PORTAL_HTTPS_PORT: "8843"
      SHOW_SERVER_LOGS: "true"
      SHOW_MONGODB_LOGS: "false"
    volumes:
      - omada-data:/opt/tplink/EAPController/data
      - omada-work:/opt/tplink/EAPController/work
      - omada-logs:/opt/tplink/EAPController/logs

  omada-mcp:
    build: .
    container_name: omada-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_ENABLE: "true"
      MCP_HTTP_BIND: 0.0.0.0
      MCP_HTTP_PORT: "3000"
    ports:
      # Secure default: reachable only from the Docker host. For a remote
      # Jarvis host, publish on a trusted LAN address and enforce firewalling;
      # every /mcp request still requires X-API-Key.
      - "127.0.0.1:3000:3000"

volumes:
  omada-data:
  omada-work:
  omada-logs:
