# Example: pairing the Omada controller with omada-mcp on the same host.
#
# IMPORTANT — this file is aspirational, not the recommended deployment today.
#
# In the current release, omada-mcp is designed to run *locally on whatever
# machine is running the MCP client* (Claude Code, Claude Desktop, etc.),
# not as a long-lived service on a server. See the "Status — local use only"
# section of README.md for the full reasoning. The MCP server speaks stdio
# only; the HTTP transport that would make a sidecar deployment viable is
# not yet implemented, and there is no authentication layer in front of it.
#
# What this file documents: the *eventual* pairing once HTTP transport and
# auth land. Today you can use the `omada-controller` service below as-is
# (it has no dependency on omada-mcp), and run omada-mcp locally on your
# laptop following README "Quick start".
services:
  omada-controller:
    image: mbentley/omada-controller:latest
    container_name: omada-controller
    restart: unless-stopped
    # mbentley's image expects host networking for SDN discovery to work
    # correctly. If you run on a remote host, switch to `network_mode: bridge`
    # with the controller's documented port set explicitly mapped.
    network_mode: host
    environment:
      TZ: America/Los_Angeles
      PUID: "1000"
      PGID: "1000"
      MANAGE_HTTP_PORT: "8088"
      MANAGE_HTTPS_PORT: "8043"
      PORTAL_HTTP_PORT: "8088"
      PORTAL_HTTPS_PORT: "8843"
      SHOW_SERVER_LOGS: "true"
      SHOW_MONGODB_LOGS: "false"
    volumes:
      - omada-data:/opt/tplink/EAPController/data
      - omada-work:/opt/tplink/EAPController/work
      - omada-logs:/opt/tplink/EAPController/logs

  # ──────────────────────────────────────────────────────────────────────────
  # Reserved for a future release. DO NOT uncomment yet.
  #
  # When the HTTP transport + Bearer-token auth land, this service will run
  # omada-mcp as a sidecar that the MCP client connects to over HTTP. Until
  # then, run omada-mcp locally per README's "Quick start".
  #
  # Also note: the `ghcr.io/<owner>/...` image reference is a placeholder —
  # no such image is currently published. The CI workflow in this repo
  # builds the image but does not push it. See README's note on the
  # `ghcr.io` reference.
  #
  # omada-mcp:
  #   image: ghcr.io/<owner>/omada-mcp:latest
  #   container_name: omada-mcp
  #   restart: unless-stopped
  #   depends_on:
  #     - omada-controller
  #   env_file: .env
  #   environment:
  #     MCP_TRANSPORT: http              # not implemented yet
  #     MCP_HTTP_ENABLE: "true"          # not implemented yet
  #     MCP_HTTP_BIND: 0.0.0.0           # only behind an authenticating proxy
  #     MCP_HTTP_PORT: "3000"
  #   ports:
  #     - "127.0.0.1:3000:3000"          # publish only to loopback by default

volumes:
  omada-data:
  omada-work:
  omada-logs:
